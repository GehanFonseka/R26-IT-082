# Core Deployment Profile: Lightweight recruitment stack without heavy ASAG & Whisper ASR models
# Usage: docker compose -f docker-compose.core.yml up

services:
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-80}:80"]
    depends_on: [api-gateway]
    networks: [lti-network]

  api-gateway:
    build: ./backend/api-gateway
    expose: ["8080"]
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CV_EXTRACTION_SERVICE_URL: http://cv-extraction-service:4001
      CV_MATCHING_SERVICE_URL: http://cv-matching-service:4002
      ATTRITION_SERVICE_URL: http://attrition-service:4003
      AUTH_SERVICE_URL: http://auth-service:3001
      CANDIDATE_SERVICE_URL: http://candidate-service:3002
      JOB_SERVICE_URL: http://job-service:4004
      CV_PROFILE_ANALYSIS_SERVICE_URL: http://cv-profile-analysis-service:4007
      RESUME_STRENGTH_MODEL_SERVICE_URL: http://resume-strength-model-service:4009
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret}
    depends_on:
      - cv-extraction-service
      - cv-matching-service
      - attrition-service
      - attrition-model-service
      - early-attrition-model-service
      - resume-strength-model-service
      - auth-service
      - candidate-service
      - job-service
      - cv-profile-analysis-service
    networks: [lti-network]

  cv-extraction-service:
    build: ./backend/services/cv-extraction-service
    environment:
      PORT: 4001
      NODE_ENV: ${NODE_ENV:-production}
    networks: [lti-network]

  cv-matching-service:
    build: ./backend/services/cv-matching-service
    environment:
      PORT: 4002
      NODE_ENV: ${NODE_ENV:-production}
      MATCHING_MODEL_DIR: /app/model
      MATCHING_MODEL_ID: cv-match-browser-local
      MATCHING_MODEL_DTYPE: fp32
      MATCHING_THRESHOLD: "0.4399277865886688"
      MATCH_EXPLANATION_MODEL_SERVICE_URL: http://resume-explanation-model-service:4012
      MATCH_EXPLANATION_TIMEOUT_MS: ${MATCH_EXPLANATION_TIMEOUT_MS:-30000}
    volumes:
      - ${MODEL_ROOT:-./backend/services/cv-matching-service/model}:/app/model:ro
    depends_on: [resume-explanation-model-service]
    networks: [lti-network]

  attrition-service:
    build: ./backend/services/attrition-service
    environment:
      PORT: 4003
      NODE_ENV: ${NODE_ENV:-production}
      ATTRITION_MODEL_SERVICE_URL: http://attrition-model-service:4008
      EARLY_ATTRITION_MODEL_SERVICE_URL: http://early-attrition-model-service:4011
      ATTRITION_EXPLANATION_MODEL_SERVICE_URL: http://resume-explanation-model-service:4012
      ATTRITION_EXPLANATION_TIMEOUT_MS: ${ATTRITION_EXPLANATION_TIMEOUT_MS:-30000}
    depends_on:
      - attrition-model-service
      - early-attrition-model-service
      - resume-explanation-model-service
    networks: [lti-network]

  attrition-model-service:
    build: ./backend/services/attrition-model-service
    environment:
      PORT: 4008
      MODEL_FILE: /app/attrition_risk_catboost_v7_optuna.joblib
      MODEL_DATASET_FILE: /app/Sri_Lankan_Hiring_Attrition_Dataset.csv
      MODEL_ID: attrition-risk-catboost-v7
      MODEL_THRESHOLD: "0.33"
    volumes:
      - ${MODEL_ROOT:-./backend/services/attrition-model-service}/attrition_risk_catboost_v7_optuna.joblib:/app/attrition_risk_catboost_v7_optuna.joblib:ro
      - ${MODEL_ROOT:-./backend/services/attrition-model-service}/Sri_Lankan_Hiring_Attrition_Dataset.csv:/app/Sri_Lankan_Hiring_Attrition_Dataset.csv:ro
    networks: [lti-network]

  early-attrition-model-service:
    build: ./backend/services/early-attrition-model-service
    environment:
      PORT: 4011
      MODEL_FILE: /app/model/model.pkl
      MODEL_ID: early-attrition-logistic-v1
    volumes:
      - ${MODEL_ROOT:-./backend/services/early-attrition-model-service/model}:/app/model:ro
    networks: [lti-network]

  resume-strength-model-service:
    build: ./backend/services/resume-strength-model-service
    environment:
      PORT: 4009
      MODEL_DIR: /app/model
      MODEL_DEVICE: ${RESUME_STRENGTH_MODEL_DEVICE:-cpu}
      MODEL_MAX_LENGTH: ${RESUME_STRENGTH_MODEL_MAX_LENGTH:-384}
    volumes:
      - ${MODEL_ROOT:-./backend/services/resume-strength-model-service/model}:/app/model:ro
    networks: [lti-network]

  resume-explanation-model-service:
    build: ./backend/services/resume-explanation-model-service
    environment:
      PORT: 4012
      NODE_ENV: ${NODE_ENV:-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    networks: [lti-network]

  auth-service:
    build: ./backend/services/auth-service
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-lanka_talent}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-change-me-admin-code}
    networks: [lti-network]

  candidate-service:
    build: ./backend/services/candidate-service
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-lanka_talent}
    networks: [lti-network]

  job-service:
    build: ./backend/services/job-service
    environment:
      PORT: 4004
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-lanka_talent}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    networks: [lti-network]

  cv-profile-analysis-service:
    build: ./backend/services/cv-profile-analysis-service
    environment:
      PORT: 4007
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI}
      CV_ANALYSIS_DB_NAME: ${CV_ANALYSIS_DB_NAME:-lanka_talent_analysis}
      RESUME_STRENGTH_MODEL_SERVICE_URL: http://resume-strength-model-service:4009
      RESUME_EXPLANATION_MODEL_SERVICE_URL: http://resume-explanation-model-service:4012
      REQUEST_TIMEOUT_MS: ${CV_ANALYSIS_REQUEST_TIMEOUT_MS:-120000}
      EXPLANATION_REQUEST_TIMEOUT_MS: ${EXPLANATION_REQUEST_TIMEOUT_MS:-30000}
    depends_on:
      - resume-strength-model-service
      - resume-explanation-model-service
    networks: [lti-network]

networks:
  lti-network:
    name: lti-network
    driver: bridge
